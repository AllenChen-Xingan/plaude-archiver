<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Plaude Archiver app icon: a voice waveform dropping into an archive drawer. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A44"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <clipPath id="trayClip">
      <rect x="252" y="604" width="532" height="196" rx="52"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle on the 1024 grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- Waveform bars; their bottoms disappear into the drawer -->
  <g fill="url(#bar)">
    <rect x="322" y="420" width="56" height="270" rx="28"/>
    <rect x="406" y="272" width="56" height="418" rx="28"/>
    <rect x="490" y="372" width="56" height="318" rx="28"/>
    <rect x="574" y="236" width="56" height="454" rx="28"/>
    <rect x="658" y="400" width="56" height="290" rx="28"/>
  </g>

  <!-- Archive drawer: front panel with a handle -->
  <g filter="url(#shadow)">
    <rect x="252" y="604" width="532" height="196" rx="52" fill="url(#tray)"/>
  </g>
  <rect x="252" y="604" width="532" height="16" fill="#FFFFFF" opacity="0.7" clip-path="url(#trayClip)"/>
  <rect x="424" y="680" width="188" height="44" rx="22" fill="#1E2A44"/>
</svg>
